<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yes We Can! Recipe Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #3B6D11;
    --green-deep: #2A4E0C;
    --amber: #854F0B;
    --amber-light: #C98A2E;
    --parchment: #F6EEDD;
    --parchment-deep: #EFE3C9;
    --ink: #241C10;
    --muted: #6b5f4c;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Source Serif 4', serif;
    background: var(--parchment);
    color: var(--ink);
    line-height: 1.5;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 36px 20px 80px; }

  .brand-row { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .brand-row img { width: 46px; height: 36px; object-fit: contain; }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: clamp(28px, 5vw, 40px);
    color: var(--green-deep);
    letter-spacing: -0.01em;
  }
  .tagline {
    font-style: italic;
    color: var(--amber);
    font-size: 15px;
    margin: 2px 0 34px 60px;
  }

  /* --- the "mad-lib" picker sentence --- */
  .picker-card {
    background: var(--white);
    border-radius: 4px;
    padding: 30px 32px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 8px 24px rgba(59,109,17,0.07);
    margin-bottom: 30px;
  }
  .picker-sentence {
    font-family: 'Playfair Display', serif;
    font-size: clamp(19px, 3.2vw, 26px);
    font-weight: 700;
    color: var(--ink);
    line-height: 1.75;
  }
  .picker-sentence .lead { color: var(--muted); font-weight: 600; }
  select.slot {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: inherit;
    color: var(--green-deep);
    background: var(--parchment);
    border: none;
    border-bottom: 3px solid var(--amber);
    border-radius: 3px 3px 0 0;
    padding: 2px 30px 2px 10px;
    margin: 0 2px;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%23854F0B' stroke-width='2' fill='none'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
    max-width: 100%;
  }
  select.slot:hover { background-color: var(--parchment-deep); }
  select.slot:focus { outline: 2px solid var(--green); outline-offset: 2px; }

  .result-count {
    margin-top: 18px;
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    color: var(--muted);
    font-size: 14px;
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--amber);
    color: var(--amber);
    font-family: 'Source Serif 4', serif;
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 3px;
    cursor: pointer;
    margin-left: 10px;
  }
  .reset-btn:hover { background: var(--amber); color: var(--white); }

  /* --- recipe grid --- */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .recipe-tile {
    background: var(--white);
    border-radius: 4px;
    padding: 18px 20px;
    cursor: pointer;
    border-left: 4px solid var(--amber-light);
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .recipe-tile:hover { box-shadow: 0 4px 14px rgba(59,109,17,0.15); transform: translateY(-1px); }
  .recipe-tile .rt-product {
    font-size: 11px;
    text-transform: none;
    letter-spacing: 0.2px;
    color: var(--green);
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
  }
  .recipe-tile h3 {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--ink);
    margin: 4px 0 6px;
    line-height: 1.25;
  }
  .recipe-tile p { font-size: 13.5px; color: var(--muted); font-style: italic; line-height: 1.4; }
  .rt-tags { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .rt-tag {
    font-size: 10.5px;
    font-family: 'Source Serif 4', serif;
    color: var(--amber);
    border: 1px solid var(--amber-light);
    border-radius: 20px;
    padding: 2px 9px;
  }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
    font-style: italic;
  }

  /* --- recipe detail overlay --- */
  .overlay {
    position: fixed; inset: 0; background: rgba(36,28,16,0.55);
    display: none; align-items: flex-start; justify-content: center;
    padding: 30px 16px; overflow-y: auto; z-index: 50;
  }
  .overlay.open { display: flex; }
  .detail-card {
    background: var(--white);
    max-width: 720px; width: 100%;
    border-radius: 6px;
    padding: 36px 40px 30px;
    position: relative;
    margin-top: 20px;
  }
  .close-btn {
    position: absolute; top: 16px; right: 18px;
    background: none; border: none; font-size: 22px;
    color: var(--muted); cursor: pointer; line-height: 1;
  }
  .close-btn:hover { color: var(--ink); }
  .detail-head img { width: 42px; height: 33px; object-fit: contain; margin-bottom: 6px; }
  .detail-tagline { font-style: italic; color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  .detail-title { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 30px; color: var(--green-deep); margin-bottom: 16px; }
  .detail-meta { display: flex; flex-wrap: wrap; gap: 22px; border-top: 2px solid var(--amber); border-bottom: 2px solid var(--amber); padding: 12px 0; margin-bottom: 22px; }
  .meta-item .meta-label { font-family: 'Source Serif 4', serif; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; color: var(--amber); text-transform: uppercase; }
  .meta-item .meta-value { font-size: 14px; color: var(--ink); margin-top: 2px; }
  .detail-cols { display: flex; gap: 34px; flex-wrap: wrap; }
  .detail-cols .col { flex: 1; min-width: 220px; }
  .section-label { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: var(--amber); margin-bottom: 10px; }
  ul.ingredients { list-style: none; font-size: 14.5px; line-height: 1.65; }
  ul.ingredients li { padding-left: 14px; position: relative; margin-bottom: 4px; }
  ul.ingredients li::before { content: "•"; position: absolute; left: 0; color: var(--amber); }
  .ing-sub { font-size: 12px; font-style: italic; color: var(--muted); margin: 10px 0 3px; }
  ol.directions { list-style: none; font-size: 14.5px; line-height: 1.6; counter-reset: step; }
  ol.directions li { counter-increment: step; padding-left: 24px; position: relative; margin-bottom: 10px; }
  ol.directions li::before { content: counter(step) "."; position: absolute; left: 0; font-weight: 700; color: var(--amber); }
  .tip-block { margin-top: 24px; border-top: 1px solid #ddd; padding-top: 14px; font-style: italic; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  .tip-block b { font-style: normal; color: var(--amber); font-family: 'Source Serif 4', serif; }

  footer.brand-footer { text-align: center; margin-top: 50px; font-size: 12px; color: var(--muted); font-style: italic; }

  @media (max-width: 480px) {
    .picker-card { padding: 22px 18px; }
    .detail-card { padding: 26px 20px 22px; }
  }
</style>
</head>

p Yes We Can! Friday Fish Blend", "1 Tbsp Yes We Can! Spiced Whole Grain Mustard", "3 Tbsp Blood Orange Marmalade", "1 Tbsp butter + splash of water"], "directions": ["Pat fillets dry. Brush both sides with Whole Grain Mustard.", "Press Friday Fish Blend onto both sides. Rest 10 minutes.", "Sear skin-side up in hot oil, 3 minutes. Flip, 3 minutes more.", "Warm marmalade with butter. Brush over fish in the last 2 minutes."], "tip": "The mustard is the binder that makes the blend stick \u2014 don't skip it even if you're tempted to season the fish directly.", "id": "Friday_Fish_Blend|Pan-Seared_Salmon_with_Blood_Orange_Glaze"}, {"product": "Friday Fish Blend", "course": "Main", "effort": "Amateur", "tagline": "Bright \u00b7 Herby \u00b7 Versatile \u2014 recovered from the Chamber event build.", "title": "Baked Cod with Pickle Brine Baste", "meta": [["PREP", "5 min"], ["COOK", "15 min"], ["SERVES", "4"], ["HEAT", "400\u00b0F"]], "ingredients": ["4 cod fillets", "2 tsp Yes We Can! Friday Fish Blend", "1 Tbsp Yes We Can! Spiced Whole Grain Mustard", "\u00bc cup Yes We Can! Garlic Dill Pickle brine", "2 Tbsp melted butter"], "directions": ["Preheat oven to 400\u00b0F. Brush cod with Whole Grain Mustard.", "Press Friday Fish Blend onto both sides of each fillet.", "Bake 12 minutes until just opaque throughout.", "Baste with pickle brine and melted butter in the final 3 minutes."], "tip": "Save the brine from an emptied Garlic Dill jar specifically for this \u2014 no need to open a fresh one just for basting liquid.", "id": "Friday_Fish_Blend|Baked_Cod_with_Pickle_Brine_Baste"}, {"product": "Friday Fish Blend", "course": "Main", "effort": "Intermediate", "tagline": "Bright \u00b7 Herby \u00b7 Versatile \u2014 recovered from the Chamber event build.", "title": "Grilled Halibut with Hot Pepper Spread Glaze", "meta": [["PREP", "10 min"], ["COOK", "8 min"], ["SERVES", "4"], ["HEAT", "Med-High"]], "ingredients": ["4 halibut fillets", "2 tsp Yes We Can! Friday Fish Blend", "1 Tbs _Fish_Blend|Friday_Fish_Night"}, {"product": "Friday Fish Blend", "course": "Appetizer", "effort": "Amateur", "tagline": "The smoked-fish dip that keeps getting asked about at events.", "title": "Friday Fish Smoked Trout Spread", "meta": [["PREP", "15 min"], ["SERVES", "6-8 (spread)"], ["STYLE", "Dip"], ["HEAT", "None"]], "ingredients": ["8 oz smoked trout", "8 oz cream cheese, softened", "\u00bc cup sour cream", "2 Tbsp fresh dill, chopped", "1 Tbsp lemon juice", "1 tsp Yes We Can! Friday Fish Blend", "1 tsp Yes We Can! Spiced Whole Grain Mustard", "Salt and pepper to taste"], "directions": ["Flake the smoked trout, removing any bones or skin.", "In a food processor, combine cream cheese, sour cream, lemon juice, mustard, and Friday Fish Blend. Pulse until smooth.", "Add flaked trout and fresh dill. Pulse briefly \u2014 you want texture, not a paste. Taste and adjust seasoning.", "Pre-portion into 1 oz jars for tasting events, or one bowl for boards. Top with a dill sprig and serve with water crackers."], "tip": "Smoking your own trout transforms a sample table \u2014 guests repeatedly ask where it's sourced. Made the day before, it actually improves overnight.", "id": "Friday_Fish_Blend|Friday_Fish_Smoked_Trout_Spread"}, {"product": "Gary's Fresh Catch", "course": "Appetizer", "effort": "Amateur", "tagline": "The freezer staple that finishes any seafood or vegetable plate.", "title": "Gary's Compound Butter", "meta": [["PREP", "10 min"], ["CHILL", "1 hr"], ["YIELDS", "\u00bd lb"], ["STYLE", "Make-ahead"]], "ingredients": ["\u00bd lb (2 sticks) unsalted butter, softened to room temp", "2 Tbsp Yes We Can! Gary's Fresh Catch", "1 tsp lemon zest", "\u00bd tsp flaky sea salt", "Optional: 1 Tbsp fresh tarragon or chives, minced"], "directions": ["Beat butter in a bowl until fluffy. Add Gary's Fresh Catch, lemon zest, salt, fresh herbs.", "Mix until evenly distributed.", "Scrape onto parchment paper. Roll into a 1.5-inch log. Twist ends like a candy wrapper. Chill 1 hour minimum.", "Slice rounds as needed for finishing fish, corn on the cob, vegetables, or steak."], "tip": "Make a double batch \u2014 freezes beautifully and finishes any weeknight dinner in 30 seconds. Keeps wrapped in fridge 2 weeks or freezer 3 months.", "id": "Gary's_Fresh_Catch|Gary's_Compound_Butter"}, {"product": "Gary's Fresh Catch", "course": "Main", "effort": "Intermediate", "tagline": "The full Seacoast clambake, made on a stovetop.", "title": "Gary's Clambake-in-a-Pot", "meta": [["PREP", "20 min"], ["COOK", "20 min"], ["SERVES", "4"], ["HEAT", "Med-High"]], "ingredients": ["2 lb littleneck clams, scrubbed", "1 lb mussels, scrubbed", "2 lobster tails (optional)", "1 lb small red potatoes", "2 ears corn, halved", "1 lb kielbasa or linguica, sliced", "2 Tbsp Yes We Can! Gary's Fresh Catch, divided", "1 cup white wine or water", "4 Tbsp butter", "Lemon wedges and parsley, to finish"], "directions": ["Layer potatoes, corn, and sausage in a large stockpot with the wine and 1 Tbsp Gary's Fresh Catch. Cover. Steam 8 min.", "Add clams and mussels. Cover. Steam 5 min until shells open.", "Add lobster tails if using. Cover. Cook 5 min until pink and curled.", "Discard any unopened clams. Melt butter with remaining Gary's Fresh Catch for drawn butter \u2014 serve at the table.", "Plate everything family-style. Lemon wedges and parsley to finish."], "tip": "Seasons everything at once. The pot is the centerpiece \u2014 serve straight from it.", "id": "Gary's_Fresh_Catch|Gary's_Clambake-in-a-Pot"}, {"product": "Gary's Fresh Catch", "course": "Main", "effort": "Amateur", "tagline": "The Seaport Fish Tuesday hero.", "title": "Gary's Crusted Baked Haddock", "meta": [["PREP", "10 min"], ["COOK", "15 min"], ["SERVES", "4"], ["HEAT", "400\u00b0F"]], "ingredients": ["4 haddock fillets", "2 Tbsp Yes We Can! Gary's Fresh Catch", "2 Tbsp mayonnaise or melted butter", "\u00bd cup panko breadcrumbs", "1 Tbsp melted butter, for the crumbs", "Lemon wedges, for serving"], "directions": ["Preheat oven to 400\u00b0F. Pat haddock dry and place in a baking dish.", "Mix mayonnaise (or melted butter) with 1 Tbsp Gary's Fresh Catch and spread over the fillets.", "Combine panko with remaining Gary's Fresh Catch and melted butter, then press over the top of each fillet.", "Bake 12-15 minutes until the crumbs are golden and the fish is just opaque. Serve with lemon wedges."], "tip": "The mayo layer keeps the fish moist under the crust \u2014 don't skip it even if you'd rather use straight butter.", "id": "Gary's_Fresh_Catch|Gary's_Crusted_Baked_Haddock"}, {"product": "Gary's Fresh Catch", "course": "Appetizer", "effort": "Amateur", "tagline": "The everyday application \u2014 the one to reach for on a random Tuesday.", "title": "Gary's Drawn Butter", "meta": [["PREP", "2 min"], ["COOK", "3 min"], ["YIELDS", "\u00bd cup"], ["HEAT", "Low"]], "ingredients": ["\u00bd cup (1 stick) butter", "1 tsp Yes We Can! Gary's Fresh Catch", "Squeeze of lemon"], "directions": ["Melt butter gently in a small saucepan over low heat.", "Stir in Gary's Fresh Catch and a squeeze of lemon.", "Serve warm alongside steamed lobster, crab, or steamers."], "tip": "The simplest possible way to put the blend to work \u2014 keep a jar by the stove all summer.", "id": "Gary's_Fresh_Catch|Gary's_Drawn_Butter"}, {"product": "Gary's Fresh Catch", "course": "Main", "effort": "Advanced", "tagline": "Tonight's first-cook proof \u2014 written exactly the way it was made, June 26, 2026.", "title": "Gary's Lobster Risotto", "meta": [["PREP", "10 min"], ["COOK", "30 min"], ["SERVES", "4"], ["HEAT", "Medium"]], "ingredients": ["1\u00bd cups arborio rice", "4-5 cups warm seafood or chicken stock", "\u00bd cup dry white wine", "1 small onion, finely diced", "2 Tbsp Yes We Can! Gary's Fresh Catch, divided", "1 lb cooked lobster meat, chopped", "3 Tbsp butter", "\u00bc cup grated parmesan", "Fresh tarragon, for garnish"], "directions": ["Saut\u00e9 onion in butter until soft. Add rice and toast 2 minutes.", "Add wine, stir until absorbed.", "Add warm stock one ladle at a time, stirring often, until each addition absorbs before the next \u2014 about 20 minutes.", "Stir in 1 Tbsp Gary's Fresh Catch partway through cooking.", "Off heat, fold in lobster meat, parmesan, and remaining Gary's Fresh Catch. Garnish with fresh tarragon."], "tip": "The blend's first proof, right on the first cook \u2014 this is the recipe that confirmed the tarragon ratio.", "id": "Gary's_Fresh_Catch|Gary's_Lobster_Risotto"}, {"product": "Gary's Fresh Catch", "course": "Main", "effort": "Amateur", "tagline": "No herb chopping required.", "title": "Gary's Lobster Roll Mayo", "meta": [["PREP", "10 min"], ["YIELDS", "enough for 4 rolls"], ["STYLE", "No-cook"], ["HEAT", "None"]], "ingredients": ["1 lb cooked lobster meat, chilled and chopped", "\u2153 cup mayonnaise", "1 tsp Yes We Can! Gary's Fresh Catch", "1 tsp lemon juice", "4 top-split hot dog buns, buttered and toasted"], "directions": ["Whisk mayonnaise, Gary's Fresh Catch, and lemon juice together.", "Fold in the chilled lobster meat gently \u2014 don't overmix.", "Pile into toasted, buttered buns and serve immediately."], "tip": "The blend already carries the herb-and-citrus lift, so there's no chopping \u2014 mix and serve.", "id": "Gary's_Fresh_Catch|Gary's_Lobster_Roll_Mayo"}, {"product": "Gary's Fresh Catch", "course": "Main", "effort": "Amateur", "tagline": "Restaurant-quality in 12 minutes.", "title": "Gary's Steamed Mussels & White Wine", "meta": [["PREP", "5 min"], ["COOK", "12 min"], ["SERVES", "2-3"], ["HEAT", "Medium"]], "ingredients": ["2 lb mussels, scrubbed and debearded", "2 Tbsp butter", "2 shallots, minced", "1 cup dry white wine", "2 tsp Yes We Can! Gary's Fresh Catch", "Crusty bread, for serving"], "directions": ["Melt butter in a large pot. Saut\u00e9 shallots until soft, 2-3 minutes.", "Add wine and Gary's Fresh Catch, bring to a simmer.", "Add mussels, cover, and steam 6-8 minutes until shells open.", "Discard any unopened mussels. Serve in bowls with the broth and crusty bread for dipping."], "tip": "The tarragon in the blend is the classic French mussels pairing \u2014 this comes together faster than most weeknight pasta.", "id": "Gary's_Fresh_Catch|Gary's_Steamed_Mussels_&_White_Wine"}, {"product": "Hunter's Cabin Duck Blend", "course": "Main", "effort": "Advanced", "tagline": "Warm \u00b7 Aromatic \u00b7 Five-Spice \u2014 recovered from the Chamber event build.", "title": "Pan-Seared Duck Breast with Blood Orange", "meta": [["PREP", "1 hr rest"], ["COOK", "17 min"], ["SERVES", "4"], ["HEAT", "Medium"]], "ingredients": ["4 duck breasts", "Full batch Yes We Can! Hunter's Cabin Duck Blend", "3 Tbsp Blood Orange Marmalade", "1 Tbsp butter", "Yes We Can! Hot Pepper Spread (finishing drizzle)"], "directions": ["Score skin in a crosshatch. Pat completely dry. Apply blend. Rest 1 hour.", "Start skin-down in a cold pan. Render slowly, 10-12 minutes.", "Flip and cook 5 minutes more for medium.", "Brush warm marmalade with butter over the skin. Drizzle with Hot Pepper Spread. Rest 5 minutes."], "tip": "Starting in a cold pan is what renders the fat properly \u2014 a hot pan from the start just seizes the skin without crisping it.", "id": "Hunter's_Cabin_Duck_Blend|Pan-Seared_Duck_Breast_with_Blood_Orange"}, {"product": "Hunter's Cabin Duck Blend", "course": "Main", "effort": "Advanced", "tagline": "Warm \u00b7 Aromatic \u00b7 Five-Spice \u2014 recovered from the Chamber event build.", "title": "Roast Whole Duck with Five-Spice Glaze", "meta": [["PREP", "Overnight"], ["ROAST", "2 hr"], ["SERVES", "4-6"], ["HEAT", "325\u00b0F"]], "ingredients": ["1 whole duck, 5-6 lb", "Full batch Yes We Can! Hunter's Cabin Duck Blend", "Blood Orange Marmalade", "\u00bd cup fresh orange juice"], "directions": ["Score duck all over. Apply blend inside and out. Chill uncovered overnight.", "Roast at 325\u00b0F breast-down for 1 hour. Flip and roast 1 hour more.", "Thin marmalade with orange juice. Glaze every 20 minutes in the final hour.", "Rest 15 minutes before carving."], "tip": "Chilling uncovered overnight dries the skin \u2014 that's the step that gets you actual crackle, not just color.", "id": "Hunter's_Cabin_Duck_Blend|Roast_Whole_Duck_with_Five-Spice_Glaze"}, {"product": "Hunter's Cabin Duck Blend", "course": "Main", "effort": "Advanced", "tagline": "Warm \u00b7 Aromatic \u00b7 Five-Spice \u2014 recovered from the Chamber event build.", "title": "Duck Leg Confit with Hot Pepper Spread Drizzle", "meta": [["PREP", "12-24 hr"], ["COOK", "2\u00bd hr + broil"], ["SERVES", "4"], ["HEAT", "300\u00b0F"]], "ingredients": ["4 duck legs", "\u00bd batch Yes We Can! Hunter's Cabin Duck Blend", "Yes We Can! Hot Pepper Spread", "Apple Bourbon Jam (optional variation)"], "directions": ["Coat duck legs thoroughly in the blend. Refrigerate 12-24 hours.", "Place in a baking dish. Cover tightly with foil.", "Bake at 300\u00b0F for 2\u00bd hours until the meat pulls easily from the bone.", "Uncover and broil 5 minutes to crisp the skin. Drizzle with Hot Pepper Spread."], "tip": "This one needs no rendered duck fat and no confit vessel \u2014 the foil-covered bake does the same slow, moist job.", "id": "Hunter's_Cabin_Duck_Blend|Duck_Leg_Confit_with_Hot_Pepper_Spread_Drizzle"}, {"product": "Hunter's Cabin Duck Blend", "course": "Appetizer", "effort": "Amateur", "tagline": "Five-spice chicken bites, built for a passed tray.", "title": "Hunter's Cabin Chicken Skewers", "meta": [["PREP", "20 min + marinate"], ["COOK", "10 min"], ["SERVES", "6-8 (skewers)"], ["HEAT", "Med-High"]], "ingredients": ["1\u00bd lb boneless chicken thighs, cubed", "1 Tbsp Yes We Can! Hunter's Cabin Duck Blend", "2 Tbsp olive oil", "Wooden skewers, soaked", "Yes We Can! Fig Balsamic Jam, for dolloping (or serve plain)"], "directions": ["Toss chicken with Hunter's Cabin blend and olive oil. Marinate at least 20 minutes.", "Thread onto skewers.", "Grill or pan-sear over medium-high heat, turning occasionally, until cooked through, about 10 minutes.", "Serve with a small dollop of jam on the side, or plain for a smaller ingredient list."], "tip": "This is your chicken-bite format for events \u2014 works equally well as cold five-spice chicken salad the next day.", "id": "Hunter's_Cabin_Duck_Blend|Hunter's_Cabin_Chicken_Skewers"}, {"product": "Hunter's Cabin Duck Blend", "course": "Appetizer", "effort": "Intermediate", "tagline": "Five-spice labneh \u2014 a bright, dip-board pairing.", "title": "Hunter's Cabin Duck Labneh", "meta": [["PREP", "15 min + 1 hr rest"], ["SERVES", "6-8"], ["STYLE", "Dip"], ["HEAT", "None"]], "ingredients": ["2 cups thick labneh or strained Greek yogurt", "1 tsp Yes We Can! Hunter's Cabin Duck Blend", "2 Tbsp fruit jam of choice", "Olive oil for drizzle", "Flaky salt", "Toasted walnuts, roughly chopped", "Fresh thyme leaves"], "directions": ["Combine labneh with Hunter's Cabin Duck Blend. Stir gently \u2014 you want the spice visible in the white, not fully incorporated.", "Rest at least 1 hour for the spices to hydrate in the dairy.", "Pool the spiced labneh on a wide plate. Drag a spoon through to create a swirled channel.", "Spoon warmed jam into the channel. Drizzle olive oil across, scatter walnuts and thyme, and finish with flaky salt."], "tip": "Standout pairing from the June 18 pop-up \u2014 a good card to lead with on the dip board.", "id": "Hunter's_Cabin_Duck_Blend|Hunter's_Cabin_Duck_Labneh"}, {"product": "Martinique", "course": "Appetizer", "effort": "Amateur", "tagline": "Tropical jerk-inspired chicken, built for a passed tray or a weeknight dinner.", "title": "Martinique Pineapple-Chutney Chicken Skewers", "meta": [["PREP", "20 min + marinate"], ["COOK", "10 min"], ["SERVES", "6-8 (skewers)"], ["HEAT", "Med-High"]], "ingredients": ["1\u00bd lb boneless chicken thighs, cubed", "1 Tbsp Yes We Can! Martinique blend", "2 Tbsp olive oil", "Wooden skewers, soaked", "Yes We Can! Pineapple & Apple Chutney, for dolloping"], "directions": ["Toss chicken with Martinique blend and olive oil. Marinate at least 20 minutes.", "Thread onto skewers.", "Grill or pan-sear over medium-high heat, turning occasionally, until cooked through, about 10 minutes.", "Serve with a small dollop of Pineapple & Apple Chutney on each skewer or on the side."], "tip": "A second chicken format alongside Hunter's Cabin \u2014 cold thigh, pineapple, and a chutney dollop on a pick works just as well for a cold buffet.", "id": "Martinique|Martinique_Pineapple-Chutney_Chicken_Skewers"}, {"product": "Milagro", "course": "Appetizer", "effort": "Amateur", "tagline": "Spanish saffron, bloomed gold, honoring John's Miracle of the Mountain.", "title": "Milagro Saffron-Paprika Dip", "meta": [["PREP", "10 min + overnight chill"], ["YIELDS", "about 1 cup"], ["STYLE", "No-cook"], ["HEAT", "None"]], "ingredients": ["1 tsp Yes We Can! Milagro blend", "1 Tbsp olive oil", "\u00be cup Greek yogurt (or sour cream)", "\u00bc cup cream cheese, softened", "\u00bd tsp lemon zest"], "directions": ["Warm the olive oil gently \u2014 15-20 seconds in the microwave or a few seconds in a small pan on low.", "Stir the Milagro blend into the warm oil to bloom the saffron; the oil should turn a deep gold. Cool 5 minutes.", "Whisk the bloomed oil into the yogurt and cream cheese along with the lemon zest.", "Cover and chill overnight \u2014 the color deepens and the saffron rounds out as it sits."], "tip": "Serve with pita chips. The visible gold color is the whole sell here \u2014 don't skip the bloom step or it reads flat.", "id": "Milagro|Milagro_Saffron-Paprika_Dip"}, {"product": "Nolet", "course": "Dessert", "effort": "Intermediate", "tagline": "Cinnamon-Cardamom-Clove \u00b7 White Pepper Edge \u2014 John's family heritage, in a cookie.", "title": "Nolet Speculaas Cookies", "meta": [["PREP", "20 min + 1 hr chill"], ["BAKE", "12 min"], ["YIELDS", "~30 cookies"], ["HEAT", "350\u00b0F"]], "ingredients": ["2\u00bc cups all-purpose flour", "1 tsp baking powder", "\u00bd tsp salt", "2 Tbsp Yes We Can! Nolet blend", "\u00be cup unsalted butter, softened", "\u00be cup packed dark brown sugar", "1 large egg", "1 tsp vanilla extract", "Sliced almonds, for pressing (traditional, optional)"], "directions": ["Whisk flour, baking powder, salt, and Nolet blend together in a bowl.", "Cream butter and brown sugar until light and fluffy, 2-3 minutes.", "Beat in egg and vanilla. Add dry ingredients, mixing until just combined.", "Chill dough at least 1 hour (or overnight \u2014 flavor deepens).", "Roll into 1-inch balls, press flat, top with a sliced almond if using.", "Bake at 350\u00b0F for 10-12 minutes until edges are just set. Cool on the pan 5 minutes before transferring."], "tip": "This is the blend's origin story on a plate \u2014 dough freezes beautifully raw; bake straight from frozen, adding 2 extra minutes.", "id": "Nolet|Nolet_Speculaas_Cookies"}, {"product": "Nolet", "course": "Dessert", "effort": "Intermediate", "tagline": "Cinnamon-Cardamom-Clove \u00b7 White Pepper Edge \u2014 John's family heritage, baked into fall.", "title": "Nolet-Spiced Apple Galette", "meta": [["PREP", "20 min"], ["BAKE", "40 min"], ["SERVES", "6-8"], ["HEAT", "400\u00b0F"]], "ingredients": ["1 sheet all-butter pie dough, chilled", "3-4 baking apples, thinly sliced", "3 Tbsp granulated sugar", "1 Tbsp Yes We Can! Nolet blend", "1 Tbsp cornstarch", "1 Tbsp lemon juice", "1 egg, beaten (egg wash)", "2 Tbsp turbinado sugar, for finishing", "Warmed honey, for drizzling"], "directions": ["Preheat oven to 400\u00b0F. Roll dough into a rough 12-inch circle on parchment.", "Toss apple slices with granulated sugar, Nolet blend, cornstarch, and lemon juice.", "Arrange apples in the center of the dough, leaving a 2-inch border. Fold the border up and over, pleating as you go.", "Brush the crust with egg wash. Sprinkle turbinado sugar over crust and apples.", "Bake 35-40 minutes until the crust is deep golden and apples are bubbling.", "Cool 10 minutes. Drizzle with warm honey before serving."], "tip": "A deliberate nod to the Fireside honey pairing \u2014 Nolet in the apples, Nolet-warmed honey on top.", "id": "Nolet|Nolet-Spiced_Apple_Galette"}, {"product": "Nolet", "course": "Dessert", "effort": "Amateur", "tagline": "The parade fundraiser that turned into the family gift-box staple.", "title": "Santa's Speculaas Cookie Mix", "meta": [["PREP", "15 min"], ["BAKE", "10-12 min"], ["YIELDS", "24 cookies"], ["HEAT", "350\u00b0F"]], "ingredients": ["2 cups all-purpose flour", "1 tsp baking powder", "\u00bd tsp baking soda", "\u00bd tsp fine sea salt", "1 cup packed brown sugar", "2 tsp Yes We Can! Nolet Speculaas Blend", "\u00bc cup coarse sugar, for rolling", {"sub": "You add:"}, "1 cup (2 sticks) unsalted butter, softened", "1 large egg", "1 tsp vanilla extract", "1 Tbsp molasses"], "directions": ["Preheat oven to 350\u00b0F. Empty jar into a bowl. Add butter, egg, vanilla, and molasses. Mix until a soft dough forms.", "Roll into 1-inch balls, roll each in coarse sugar, space 2 inches apart on a parchment-lined sheet.", "Bake 10-12 min, until edges are set but centers still look soft.", "Cool on the sheet 5 min before moving to a rack. Makes about 24 cookies."], "tip": "Built from Nolet \u2014 our Dutch spice blend named for John's side of the family. For a festive stretch, press the dough into a buttered 10\" cast iron skillet instead of rolling \u2014 bake 22-25 min and slice like a pie.", "id": "Nolet|Santa's_Speculaas_Cookie_Mix"}, {"product": "Sage Advice", "course": "Appetizer", "effort": "Amateur", "tagline": "Sage-forward and proud of it, dressed for the cheese board.", "title": "Sage Advice Orange-Sage Dip", "meta": [["PREP", "10 min + overnight chill"], ["YIELDS", "about 1\u00bc cups"], ["STYLE", "No-cook"], ["HEAT", "None"]], "ingredients": ["8 oz cream cheese, softened", "\u00bc cup sour cream", "1 tsp Yes We Can! Sage Advice blend", "\u00bd tsp orange zest", "1 tsp honey"], "directions": ["Whisk the cream cheese and sour cream together until smooth.", "Fold in the Sage Advice blend, orange zest, and honey.", "Cover and chill overnight so the sage rounds out and the orange settles in rather than sitting on top."], "tip": "A good preview taste of what's inside the Turkey Brining Kit \u2014 a nice way to introduce guests to it before the holidays.", "id": "Sage_Advice|Sage_Advice_Orange-Sage_Dip"}, {"product": "Spring Chicken", "course": "Main", "effort": "Advanced", "tagline": "Lemon-herbal, honey-brined, and gone before the leftovers had a chance to cool.", "title": "Spring Chicken Velout\u00e9 Linguine", "meta": [["PREP", "20 min"], ["COOK", "30 min"], ["SERVES", "4"], ["BLEND", "Spring Chicken"]], "ingredients": [{"sub": "For the chicken:"}, "4 boneless chicken breasts, brined in honey brine", {"sub": "For the velout\u00e9:"}, "3 Tbsp unsalted butter", "1\u00bd tsp Yes We Can! Spring Chicken blend, plus more to taste", "3 Tbsp all-purpose flour", "2 cups chicken stock", "\u00bc cup heavy cream", "\u00bd tsp kosher salt, plus more to taste", "\u00bc tsp black pepper", {"sub": "To finish:"}, "1 lb linguine", "2 cups cherry tomatoes, halved", "1 lb baby spinach, chopped", "\u00bd cup fresh basil, torn"], "directions": ["Sear or bake the honey-brined chicken breasts until cooked through and golden. Rest 5-10 minutes, then slice on the bias.", "Bring a large pot of salted water to a boil. Cook the linguine until just short of al dente \u2014 it finishes in the sauce. Reserve 1 cup pasta water, then drain.", "Melt the butter in a wide saucepan over medium heat. Add the Spring Chicken blend and stir about a minute to bloom the herbs.", "Whisk in the flour and cook, whisking constantly, 1-2 minutes until no raw flour remains.", "Slowly whisk in the chicken stock, a splash at a time. Simmer, whisking occasionally, until the sauce coats the back of a spoon.", "Stir in the cream. Taste and adjust the blend, salt, and pepper \u2014 the honey brine already carries salt, so season gently.", "Stir in the tomatoes and spinach. Cook 3-4 minutes, just until the spinach wilts and the tomatoes soften but hold their shape.", "Toss in the drained linguine, loosening with reserved pasta water as needed. Fold in the sliced chicken and basil off the heat. Serve immediately."], "tip": "Start light on the Spring Chicken blend \u2014 the lavender in it is meant to be a whisper, and it's easier to add more than pull back once the sauce reduces. Tested and approved: John went back for seconds.", "id": "Spring_Chicken|Spring_Chicken_Velout\u00e9_Linguine"}, {"product": "Spring Chicken", "course": "Appetizer", "effort": "Amateur", "tagline": "Garden-bright and lemon-forward, built for the veggie tray.", "title": "Spring Chicken Herb-Lemon Dip", "meta": [["PREP", "10 min + overnight chill"], ["YIELDS", "about 1 cup"], ["STYLE", "No-cook"], ["HEAT", "None"]], "ingredients": ["\u00be cup Greek yogurt (or sour cream)", "\u00bc cup cream cheese, softened", "1 tsp Yes We Can! Spring Chicken blend, plus more to taste", "\u00bd tsp lemon zest", "1 Tbsp fresh chives, finely chopped"], "directions": ["Whisk the yogurt and cream cheese together until smooth.", "Fold in the Spring Chicken blend, lemon zest, and chives.", "Taste \u2014 the lavender in the blend builds as it sits, so start with 1 tsp and add up to \u00bd tsp more only after tasting.", "Cover and chill overnight before serving."], "tip": "Serve with crudit\u00e9s \u2014 this one reads bright and garden-fresh next to the smokier dips on the table.", "id": "Spring_Chicken|Spring_Chicken_Herb-Lemon_Dip"}, {"product": "Vov\u00f3", "course": "Appetizer", "effort": "Amateur", "tagline": "Smoke, garlic, sun \u2014 Portugal in a bowl, minus the plane ticket.", "title": "Vov\u00f3 Smoky Garlic Dip", "meta": [["PREP", "10 min + overnight chill"], ["YIELDS", "about 1\u00bd cups"], ["STYLE", "No-cook"], ["HEAT", "Mild"]], "ingredients": ["8 oz cream cheese, softened", "\u00bc cup sour cream", "1\u00bd tsp Yes We Can! Vov\u00f3 blend", "1 tsp lemon juice", "1 small garlic clove, grated (or \u00bc tsp more granulated garlic)"], "directions": ["Whisk the cream cheese and sour cream together until smooth.", "Fold in the Vov\u00f3 blend, lemon juice, and garlic.", "Cover and chill overnight so the smoked paprika and cumin settle into the base."], "tip": "Finish with a drizzle of olive oil right at the table \u2014 it wakes the smoked paprika back up. Great with kettle chips or crusty bread.", "id": "Vov\u00f3|Vov\u00f3_Smoky_Garlic_Dip"}, {"product": "Vov\u00f3", "course": "Appetizer", "effort": "Intermediate", "tagline": "Portugal Night starter \u2014 bright citrus meets smoky Vov\u00f3.", "title": "Vov\u00f3 Shrimp Ceviche Bites", "meta": [["PREP", "20 min + 20 min cure"], ["YIELDS", "about 24 bites"], ["STYLE", "No-cook"], ["HEAT", "Mild"]], "ingredients": ["1 lb small shrimp, cooked and chopped", "Juice of 2 limes", "Juice of 1 lemon", "\u00bd small red onion, finely diced", "1 tsp Yes We Can! Vov\u00f3 blend", "2 Tbsp olive oil", "Salt, to taste", "Fresh cilantro, for garnish", {"sub": "To serve:"}, "Small glasses, spoons, or sturdy crackers"], "directions": ["Toss chopped shrimp with lime and lemon juice. Chill 20 minutes to lightly cure.", "Drain off excess citrus liquid.", "Fold in the red onion, Vov\u00f3 blend, and olive oil. Season with salt to taste.", "Spoon into small glasses or onto crackers. Garnish with cilantro just before serving."], "tip": "Pairs with a Vinho Verde \u2014 assemble components ahead, but fold everything together within a couple hours of serving so the onion doesn't turn watery.", "id": "Vov\u00f3|Vov\u00f3_Shrimp_Ceviche_Bites"}, {"product": "Vov\u00f3", "course": "Appetizer", "effort": "Intermediate", "tagline": "Portugal Night mains \u2014 smoke and char for a grill-forward red.", "title": "Vov\u00f3 Grilled Steak Tips", "meta": [["PREP", "10 min + overnight rest"], ["COOK", "10 min"], ["SERVES", "6-8 (bites)"], ["HEAT", "Med-High"]], "ingredients": ["1\u00bd lb sirloin steak tips", "2 Tbsp Yes We Can! Vov\u00f3 blend", "1 Tbsp olive oil"], "directions": ["Pat steak tips dry. Press the Vov\u00f3 blend firmly into all sides, then rub with olive oil.", "Cover and refrigerate overnight \u2014 the dry rub only improves with time.", "Bring to room temperature 30 minutes before cooking. Grill over high heat to desired doneness.", "Rest 5 minutes, then slice against the grain and serve warm."], "tip": "Pairs with a Touriga Nacional \u2014 rub and refrigerate the night before, then grill just before serving.", "id": "Vov\u00f3|Vov\u00f3_Grilled_Steak_Tips"}, {"product": "Vov\u00f3", "course": "Appetizer", "effort": "Intermediate", "tagline": "Portugal Night mains \u2014 pork and hard cheese, built for a fruity D\u00e3o red.", "title": "Vov\u00f3 Pork & Manchego Skewers", "meta": [["PREP", "15 min + overnight marinate"], ["COOK", "8 min"], ["SERVES", "6-8 (skewers)"], ["HEAT", "Med-High"]], "ingredients": ["1 lb pork tenderloin, cut into 1\" cubes", "1\u00bd Tbsp Yes We Can! Vov\u00f3 blend", "1 Tbsp olive oil", "6 oz Manchego (or other firm cheese), cut into 1\" cubes", "Skewers"], "directions": ["Toss pork cubes with the Vov\u00f3 blend and olive oil.", "Cover and refrigerate overnight to marinate.", "Grill or pan-sear the pork until just cooked through, about 8 minutes total.", "Skewer warm pork alternating with Manchego cubes right before serving, so the cheese holds its shape."], "tip": "Pairs with a fruity D\u00e3o red \u2014 marinate the pork the night before, but cook and skewer with the cheese the day of.", "id": "Vov\u00f3|Vov\u00f3_Pork_&_Manchego_Skewers"}, {"product": "Taboodney", "course": "Appetizer", "effort": "Amateur", "tagline": "Spiced mayo built for smash burgers.", "title": "Taboodney Burger Aioli", "meta": [["PREP", "10 min + 30 min rest"], ["YIELDS", "about 1 cup"], ["STYLE", "No-cook"], ["HEAT", "None"]], "ingredients": ["1 cup good-quality mayo or homemade aioli", "1 tsp Yes We Can! Taboodney blend, lightly toasted", "1 Tbsp Yes We Can! Spiced Whole Grain Mustard", "1 tsp Yes We Can! Dr. Pepper BBQ Sauce", "Few drops Yes We Can! Bread & Butter Pickle brine (optional)"], "directions": ["Toast the Taboodney blend briefly in a dry pan \u2014 30 seconds, until aromatic. The residual heat blooms the spices.", "Whisk the warm blend into the mayo immediately.", "Add Whole Grain Mustard and a drizzle of Dr. Pepper BBQ Sauce. Stir to combine.", "Rest at least 30 minutes before serving \u2014 the flavors knit together and the cinnamon deepens.", "For sharper acidity, finish with a few drops of Bread & Butter Pickle brine."], "tip": "The Dr. Pepper BBQ Sauce bridges the dip back to the burger \u2014 this is the move that ties condiment to dish.", "id": "Taboodney|Taboodney_Burger_Aioli"}, {"product": "Taboodney", "course": "Appetizer", "effort": "Amateur", "tagline": "Salty, spiced, creamy \u2014 mezze board centerpiece.", "title": "Taboodney Whipped Feta", "meta": [["PREP", "15 min"], ["SERVES", "6-8"], ["STYLE", "Dip"], ["HEAT", "None"]], "ingredients": ["8 oz block feta", "2 oz cream cheese", "2 Tbsp olive oil, plus more for finishing", "1\u00bd tsp Yes We Can! Taboodney blend, toasted and cooled", "1 tsp Yes We Can! Spiced Whole Grain Mustard (optional)", "Yes We Can! Dr. Pepper BBQ Sauce, for drizzle", "Warm pita, fresh vegetables, Yes We Can! Bread & Butter Pickles for serving"], "directions": ["Toast the Taboodney blend in a dry pan until aromatic. Cool completely.", "In a food processor, combine feta, cream cheese, and olive oil. Process until completely smooth \u2014 2-3 minutes.", "Fold in the Taboodney blend generously. If using, blend in the mustard for a sharp, seedy backbone.", "Swirl onto a plate and drizzle with olive oil and a ribbon of Dr. Pepper BBQ Sauce.", "Serve with warm pita, fresh vegetables, and Bread & Butter Pickles on the side for acidity."], "tip": "The cola depth of the Dr. Pepper BBQ plays beautifully against the sharp cheese \u2014 this is the unexpected pairing that makes the dip memorable.", "id": "Taboodney|Taboodney_Whipped_Feta"}, {"product": "Taboodney", "course": "Appetizer", "effort": "Amateur", "tagline": "The cool counterpoint to anything spicy or grilled.", "title": "Taboodney Yogurt Sauce", "meta": [["PREP", "15 min + 1 hr rest"], ["YIELDS", "about 2 cups"], ["STYLE", "No-cook"], ["HEAT", "None"]], "ingredients": ["2 cups full-fat Greek yogurt", "1\u00bd tsp Yes We Can! Taboodney blend, toasted and cooled", "1 small garlic clove, finely minced", "2 Tbsp fresh mint, chopped", "1 Tbsp lemon juice", "Olive oil for finishing", "Yes We Can! Hot Pepper Spread, for finishing drizzle (optional)"], "directions": ["Toast the Taboodney blend in a dry pan. Cool completely.", "Stir blend into yogurt with minced garlic, fresh mint, and lemon juice.", "Rest at least 1 hour for the flavors to develop.", "Drizzle with olive oil, and a thread of Hot Pepper Spread if you want heat, just before serving."], "tip": "Our renamed Lebanese 7-spice blend, doing what it does best \u2014 cooling contrast for anything spiced or grilled.", "id": "Taboodney|Taboodney_Yogurt_Sauce"}, {"product": "Yia Yia", "course": "Dessert", "effort": "Intermediate", "tagline": "Melomakarona-style \u2014 the one my jar was made for.", "title": "Yia Yia Honey Cookies", "meta": [["PREP", "15 min"], ["BAKE", "18-20 min"], ["YIELDS", "~24 cookies"], ["HEAT", "350\u00b0F"]], "ingredients": ["\u00be cup olive oil", "\u00bc cup granulated sugar", "\u00bc cup fresh orange juice", "1 Tbsp Yes We Can! Yia Yia blend", "\u00bd tsp baking soda", "2\u00bc cups all-purpose flour", "\u00bd cup honey", "\u00bc cup water", "\u00bd cup walnuts, chopped, for topping"], "directions": ["Preheat oven to 350\u00b0F. Whisk together olive oil, sugar, orange juice, and Yia Yia blend.", "Stir in baking soda, then fold in flour until a soft dough forms.", "Roll into small ovals, place on a parchment-lined sheet, and bake 18-20 minutes until golden.", "Warm honey and water together in a small saucepan until syrupy.", "Dip warm cookies into the honey syrup, set on a rack, and top with walnuts and a pinch more Yia Yia."], "tip": "Every yia yia has a spice tin like this one \u2014 and a cookie plate that never quite empties.", "id": "Yia_Yia|Yia_Yia_Honey_Cookies"}, {"product": "Yia Yia", "course": "Dessert", "effort": "Amateur", "tagline": "No baking required \u2014 the whole spice tin, minus the tin.", "title": "Yia Yia Spiced Honey Pour", "meta": [["PREP", "5 min"], ["WARM", "2 min"], ["YIELDS", "\u00bd cup"], ["HEAT", "Low"]], "ingredients": ["\u00bd cup honey", "\u00bd tsp Yes We Can! Yia Yia blend", "1 tsp water, optional \u2014 for a thinner pour"], "directions": ["Warm honey gently in a small saucepan or microwave-safe bowl, just until it loosens \u2014 do not boil.", "Stir in Yia Yia blend until fully combined.", "Add a splash of water if you'd like it thinner for drizzling.", "Pour into a small jar. Keeps at room temperature, airtight, up to a month."], "tip": "Use it on coffee or tea, yogurt or oatmeal, roasted fruit, ricotta or feta toast \u2014 or just off a spoon.", "id": "Yia_Yia|Yia_Yia_Spiced_Honey_Pour"}, {"product": "Bread & Butter Pickles", "course": "Appetizer", "effort": "Amateur", "tagline": "Cocktail-format picks \u2014 built for a passed tray.", "title": "Bread & Butter Pickle & Cheddar Picks", "meta": [["PREP", "10 min"], ["SERVES", "8-10 (picks)"], ["STYLE", "No-cook"], ["HEAT", "None"]], "ingredients": ["1 jar Yes We Can! Bread & Butter Pickles, drained", "8 oz sharp cheddar, cubed", "Cocktail picks"], "directions": ["Skewer one pickle slice (folded in half) and one cheddar cube on each pick.", "Arrange on a platter, cut-side up so the sweet-tart glaze is visible.", "Serve chilled, straight from the fridge."], "tip": "The sweetness in the pickle brine plays against sharp cheddar \u2014 this is the simplest, fastest cocktail bite in the whole lineup.", "id": "Bread_&_Butter_Pickles|Bread_&_Butter_Pickle_&_Cheddar_Picks"}, {"product": "Dr. Pepper BBQ Sauce", "course": "Main", "effort": "Intermediate", "tagline": "The cola depth of the sauce, reduced down over lamb.", "title": "BBQ Lamb Chops with Dr. Pepper Reduction", "meta": [["PREP", "10 min"], ["COOK", "15 min"], ["SERVES", "4"], ["HEAT", "Med-High"]], "ingredients": ["8 lamb rib chops", "Salt and pepper", "1 Tbsp olive oil", "\u00bd cup Yes We Can! Dr. Pepper BBQ Sauce", "2 Tbsp balsamic vinegar", "1 Tbsp butter, cold"], "directions": ["Season lamb chops with salt and pepper. Sear in hot olive oil, 3-4 minutes per side for medium-rare. Rest on a plate.", "In the same pan, add Dr. Pepper BBQ Sauce and balsamic vinegar. Simmer 3-4 minutes until slightly thickened.", "Whisk in cold butter off heat to finish the glaze glossy.", "Spoon the reduction over the chops and serve immediately."], "tip": "The cola-and-spice backbone of the sauce is built for red meat \u2014 this is the fastest way to show it off.", "id": "Dr._Pepper_BBQ_Sauce|BBQ_Lamb_Chops_with_Dr._Pepper_Reduction"}, {"product": "Garlic Dill Pickle", "course": "Appetizer", "effort": "Amateur", "tagline": "A bright, garlicky tartar sauce built around Yes We Can! Garlic Dill Pickles.", "title": "Garlic Dill Pickle Tartar Sauce", "meta": [["PREP", "10 min + 30 min chill"], ["YIELDS", "~1\u00bc cups"], ["STYLE", "No-cook"], ["HEAT", "None"]], "ingredients": ["1 cup mayonnaise", "\u2153 cup Yes We Can! Garlic Dill Pickle, finely diced (or the half-pint charcuterie dice)", "1 Tbsp pickle brine (from the jar)", "1 Tbsp yellow onion or shallot, finely minced", "1 Tbsp fresh parsley, chopped", "1 tsp Dijon mustard", "1 tsp fresh lemon juice", "\u00bc tsp black pepper, freshly ground", "Pinch kosher salt, to taste"], "directions": ["If starting from spears or chips rather than the pre-diced charcuterie size, finely dice the Garlic Dill Pickles into small, even pieces.", "In a medium bowl, whisk together mayonnaise, Dijon mustard, lemon juice, and pickle brine until smooth.", "Fold in the diced pickles, minced onion, and chopped parsley. Season with black pepper and a pinch of salt, then taste and adjust.", "Cover and refrigerate at least 30 minutes before serving to let the flavors meld."], "tip": "Because the pickles already carry garlic and dill flavor, you likely won't need extra of either \u2014 taste before adding anything more. Great with fried fish, crab cakes, or Gary's Fresh Catch-seasoned seafood.", "id": "Garlic_Dill_Pickle|Garlic_Dill_Pickle_Tartar_Sauce"}, {"product": "Hot Honey Carrots", "course": "Appetizer", "effort": "Amateur", "tagline": "Cocktail-format picks for a passed tray.", "title": "Pickled Hot Honey Carrot Picks", "meta": [["PREP", "5 min"], ["SERVES", "8-10 (picks)"], ["STYLE", "No-cook"], ["HEAT", "Mild"]], "ingredients": ["1 jar Yes We Can! Pickled Hot Honey Carrots, drained", "Cocktail picks", "Flaky salt (optional)"], "directions": ["Skewer 2-3 carrot pieces on each pick.", "Arrange upright in a small glass or fan out on a platter.", "Finish with a pinch of flaky salt if desired, and serve chilled."], "tip": "The single easiest tasting-table item in the whole lineup \u2014 no prep beyond opening the jar.", "id": "Hot_Honey_Carrots|Pickled_Hot_Honey_Carrot_Picks"}, {"product": "Hot Honey Carrots", "course": "Appetizer", "effort": "Amateur", "tagline": "Premium milestone-celebration bite.", "title": "Hot Honey Carrots & Whipped Feta", "meta": [["PREP", "20 min"], ["SERVES", "8"], ["STYLE", "Board"], ["HEAT", "None"]], "ingredients": ["1 jar Yes We Can! Pickled Hot Honey Carrots", "8 oz block feta", "4 oz cream cheese", "2 Tbsp olive oil", "Local honey, for drizzle", "Flaky salt", "Fresh mint leaves"], "directions": ["Whip feta and cream cheese with olive oil in a food processor until smooth and airy.", "Spread the whipped feta on a wide plate or serving board.", "Drain the carrots and stand them upright pressed into the feta.", "Drizzle with local honey across the tops of the carrots and the feta.", "Finish with flaky salt and torn fresh mint."], "tip": "A real charcuterie-board favorite \u2014 this is the whipped feta application to lead with.", "id": "Hot_Honey_Carrots|Hot_Honey_Carrots_&_Whipped_Feta"}, {"product": "Hot Honey Carrots", "course": "Cocktail", "effort": "Amateur", "tagline": "Built on Hot Honey Carrot brine \u2014 a golden, low-proof spritz.", "title": "Hot Honey Carrot Brine Spritz", "meta": [["PREP", "3 min"], ["YIELDS", "1 cocktail"], ["STYLE", "No-cook"], ["HEAT", "None"]], "ingredients": ["2 Tbsp Yes We Can! Hot Honey Carrot Pickle brine", "Prosecco or sparkling water", "Splash of soda, for lift", "Ice", "Citrus slice, for garnish"], "directions": ["Fill a wine glass with ice.", "Add the Hot Honey Carrot brine.", "Top with prosecco (for cocktail) or sparkling water (for non-alcoholic). Finish with a splash of soda for lift.", "Garnish with a citrus slice."], "tip": "Clean, golden, genuinely good. Drop it in a wine glass and it looks like a cocktail without being one \u2014 the easiest sell for a wine bar.", "id": "Hot_Honey_Carrots|Hot_Honey_Carrot_Brine_Spritz"}, {"product": "Hot Honey Carrots", "course": "Cocktail", "effort": "Amateur", "tagline": "Built on Hot Honey Carrot brine \u2014 the shrub replaces the sugar cube.", "title": "Hot Honey Carrot Brine Old Fashioned", "meta": [["PREP", "5 min"], ["YIELDS", "1 cocktail"], ["STYLE", "No-cook"], ["HEAT", "None"]], "ingredients": ["2 Tbsp Yes We Can! Hot Honey Carrot Pickle brine", "2 oz bourbon", "2 dashes aromatic bitters", "Large ice cube", "Orange peel"], "directions": ["Combine Hot Honey Carrot brine, bourbon, and bitters in a mixing glass.", "Add ice and stir until well-chilled \u2014 about 30 seconds.", "Strain over a large ice cube in a rocks glass.", "Express orange peel over the drink and drop in."], "tip": "Honey depth + bourbon warmth + brine brightness. The shrub-like brine stands in for both the sugar and the orange brightness.", "id": "Hot_Honey_Carrots|Hot_Honey_Carrot_Brine_Old_Fashioned"}, {"product": "Hot Honey Carrots", "course": "Cocktail", "effort": "Amateur", "tagline": "Built on Hot Honey Carrot brine \u2014 NH honey meets NH gin.", "title": "Hot Honey Carrot Brine & Gin", "meta": [["PREP", "3 min"], ["YIELDS", "1 cocktail"], ["STYLE", "No-cook"], ["HEAT", "None"]], "ingredients": ["2 Tbsp Yes We Can! Hot Honey Carrot Pickle brine", "2 oz NH gin (or any quality dry gin)", "Top with sparkling water", "Ice", "Cucumber slice or fresh herb"], "directions": ["Fill a highball with ice.", "Add the brine and gin.", "Top with sparkling water.", "Garnish with cucumber slice or a fresh herb sprig."], "tip": "Two NH businesses, one cocktail \u2014 easy storytelling at the wine bar level. Works as a feature cocktail with no other ingredients required.", "id": "Hot_Honey_Carrots|Hot_Honey_Carrot_Brine_&_Gin"}, {"product": "Hot Honey Carrots", "course": "Cocktail", "effort": "Amateur", "tagline": "Built on Hot Honey Carrot brine \u2014 the non-alcoholic answer.", "title": "Hot Honey Carrot Brine Mocktail", "meta": [["PREP", "3 min"], ["YIELDS", "1 mocktail"], ["STYLE", "No-cook"], ["HEAT", "None"]], "ingredients": ["2 Tbsp Yes We Can! Hot Honey Carrot Pickle brine", "4 oz ginger beer", "Squeeze of lime", "Ice", "Lime wedge, for garnish"], "directions": ["Fill a glass with ice.", "Add the brine and a squeeze of lime.", "Top with ginger beer.", "Garnish with a lime wedge."], "tip": "Designed for the wine bar moment where someone in the party doesn't drink alcohol \u2014 same glass, same presentation, no apology required.", "id": "Hot_Honey_Carrots|Hot_Honey_Carrot_Brine_Mocktail"}, {"product": "Hot Honey Carrots", "course": "Cocktail", "effort": "Intermediate", "tagline": "The Saturday brunch signature \u2014 works as cocktail or mocktail.", "title": "Pomegranate Tempranillo Shrub Cocktail", "meta": [["PREP", "5 min"], ["YIELDS", "1 cocktail"], ["STYLE", "Shrub base"], ["HEAT", "Low"]], "ingredients": ["2 Tbsp Pomegranate Tempranillo shrub base (see method)", "4 oz sparkling water OR 2 oz Tempranillo wine + 2 oz sparkling water", "Ice", "Pomegranate seeds, for garnish", "Fresh mint sprig", {"sub": "Shrub base:"}, "1 cup pomegranate juice", "\u00bd cup honey", "2 Tbsp Tempranillo wine", "\u00bd cup apple cider vinegar"], "directions": ["Simmer pomegranate juice with honey and Tempranillo wine until reduced by \u2153. Cool, then combine with apple cider vinegar. Store in fridge up to 1 month.", "Fill a wine glass with ice. Add the shrub base.", "Top with sparkling water for mocktail, or wine + sparkling for cocktail.", "Drop in fresh pomegranate seeds \u2014 they sink and reappear with each sip. Garnish with mint."], "tip": "The Saturday brunch hit \u2014 a standalone shrub technique that pairs beautifully with the carrot brine cocktails above.", "id": "Hot_Honey_Carrots|Pomegranate_Tempranillo_Shrub_Cocktail"}, {"product": "Hot Pepper Spread", "course": "Appetizer", "effort": "Amateur", "tagline": "Documented breakout hit \u2014 Greek yogurt streaked with the spread.", "title": "Hot Pepper Spread Whipped Yogurt Dip", "meta": [["PREP", "10 min"], ["SERVES", "8-10"], ["STYLE", "Dip"], ["HEAT", "Mild"]], "ingredients": ["2 cups Greek yogurt, strained", "4 oz cream cheese, softened", "\u00bc cup Yes We Can! Hot Pepper Spread, plus more for streaking", "1 tsp lemon juice", "Pinch of salt"], "directions": ["Whip Greek yogurt and cream cheese together until light and fluffy.", "Fold in lemon juice and a pinch of salt.", "Spread onto a plate, then streak Hot Pepper Spread across the top in a swirled pattern rather than mixing it in fully.", "Serve with focaccia squares or seeded crackers for dipping."], "tip": "Noted as \"Friday's breakout hit\" at the June pop-ups \u2014 the red-on-white visual reads well for photos.", "id": "Hot_Pepper_Spread|Hot_Pepper_Spread_Whipped_Yogurt_Dip"}, {"product": "Pineapple & Apple Chutney", "course": "Appetizer", "effort": "Amateur", "tagline": "Sweet, tangy, and layered right on top \u2014 the classic cracker-table showstopper.", "title": "Pineapple & Apple Chutney Cream Cheese Dip", "meta": [["PREP", "5 min"], ["YIELDS", "serves 6-8"], ["STYLE", "No-cook"], ["HEAT", "None"]], "ingredients": ["8 oz cream cheese, softened", "\u2153 cup Yes We Can! Pineapple & Apple Chutney", "Pinch of flaky salt", "Plain crackers, for serving"], "directions": ["Whip the softened cream cheese until light and spreadable.", "Spread onto a small serving plate or shallow dish.", "Spoon the chutney over the top just before serving \u2014 layer it rather than folding it in, so it holds its texture and the color pops.", "Finish with a pinch of flaky salt and serve with plain crackers so the chutney stays the star."], "tip": "For a grab-and-go format, dice the chutney small and fold it fully into the cream cheese instead of layering \u2014 travels well in individual cups for a beach or picnic table.", "id": "Pineapple_&_Apple_Chutney|Pineapple_&_Apple_Chutney_Cream_Cheese_Dip"}, {"product": "Spiced Whole Grain Mustard", "course": "Main", "effort": "Amateur", "tagline": "Chicken salad and a quick weeknight technique in one card.", "title": "Honey Mustard Chicken & Salad", "meta": [["PREP", "15 min"], ["COOK", "15 min"], ["SERVES", "4"], ["HEAT", "Medium"]], "ingredients": ["4 boneless chicken breasts or 1\u00bd lb thighs", "2 Tbsp Yes We Can! Spiced Whole Grain Mustard", "2 Tbsp honey", "1 Tbsp olive oil", "Salt and pepper", "Mixed greens, for serving"], "directions": ["Whisk mustard, honey, and olive oil together. Toss chicken in half the mixture, reserving the rest.", "Sear or bake chicken until cooked through, basting with a little of the reserved glaze in the final minutes.", "Rest, then slice. Toss remaining glaze with mixed greens as a quick dressing, or dice the chicken cold for a mustard chicken salad."], "tip": "Works two ways from one batch of glaze \u2014 plated warm for dinner, or diced cold the next day for a fast lunch salad.", "id" const ANY = "Any";
let state = { course: ANY, product: ANY, effort: ANY };

function populateSelect(el, values, label) {
  el.innerHTML = "";
  const anyOpt = document.createElement("option");
  anyOpt.value = ANY;
  anyOpt.textContent = "any " + label;
  el.appendChild(anyOpt);
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v;
    el.appendChild(opt);
  });
}

const courseSelect = document.getElementById("courseSelect");
const productSelect = document.getElementById("productSelect");
const effortSelect = document.getElementById("effortSelect");

populateSelect(courseSelect, DATA.courses, "course");
populateSelect(productSelect, DATA.products, "product");
populateSelect(effortSelect, DATA.efforts, "effort level");

courseSelect.value = ANY;
productSelect.value = ANY;
effortSelect.value = ANY;

function matches(r) {
  return (state.course === ANY || r.course === state.course)
      && (state.product === ANY || r.product === state.product)
      && (state.effort === ANY || r.effort === state.effort);
}

function render() {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("emptyState");
  const count = document.getElementById("resultCount");
  const filtered = DATA.recipes.filter(matches);

  count.textContent = filtered.length === DATA.recipes.length
    ? `Browsing all ${filtered.length} recipes.`
    : `${filtered.length} recipe${filtered.length === 1 ? "" : "s"} match${filtered.length === 1 ? "es" : ""}.`;

  grid.innerHTML = "";
  empty.style.display = filtered.length ? "none" : "block";

  filtered.forEach(r => {
    const tile = document.createElement("div");
    tile.className = "recipe-tile";
    tile.innerHTML = `
      <div class="rt-product">${r.product}</div>
      <h3>${r.title}</h3>
      <p>${r.tagline}</p>
      <div class="rt-tags">
        <span class="rt-tag">${r.course}</span>
        <span class="rt-tag">${r.effort}</span>
      </div>
    `;
    tile.addEventListener("click", () => openDetail(r));
    grid.appendChild(tile);
  });
}

function ingredientsHtml(ingredients) {
  return ingredients.map(item => {
    if (typeof item === "object" && item.sub) {
      return `<div class="ing-sub">${item.sub}</div>`;
    }
    return `<li>${item}</li>`;
  }).join("");
}

function metaHtml(meta) {
  return meta.map(([label, value]) =>
    `<div class="meta-item"><div class="meta-label">${label}</div><div class="meta-value">${value}</div></div>`
  ).join("");
}
